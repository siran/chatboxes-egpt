# The example skin's texts and places. The widget asks for "skin.json"; eGPT's http limb
# serves it from this file (parsed as YAML, sent as JSON). A skin.yaml that does not parse
# is a 500 and a log line with its path and line: the widget then runs on its built-in texts.
# Every key is optional; a key that is missing keeps the widget's built-in (Spanish) text.

strings:
  title: "Contoso · Help"          # the panel's header (default: the chatbox's title, else "Chat")
  intro: "Hi! Ask me anything about your account."   # the panel's first line, shown again after an end
  placeholder: "Type your question…"                 # the input's placeholder
  send: "Send"                     # the send button's tooltip
  open: "Open chat"                # the bubble's label
  close: "Close"                   # the minimise button's label

  # Ending the conversation: the button, the question, yes, no.
  end: "End conversation"
  end_confirm: "End this conversation? The chat will start over."
  end_yes: "Yes, end it"
  cancel: "Cancel"

  # Failures: any failed line, a 413, a 429, and a panel that cannot open.
  error: "Could not send. Try again."
  too_long: "The message is too long."
  too_many: "Too many messages. Wait a few minutes."
  unavailable: "Could not open the chat. Try again."

  identity: "We could not verify your session. Reload the page or sign in again."   # a 401
  support: "Support"               # heads a human support line: "Support · <user>"

  # Phrases that rotate in the loading bubble (2.5 s each; at most 12 of 80 characters).
  waiting:
    - "One moment…"
    - "Looking into it…"
    - "Almost there…"
  # The set used when the conversation is cold (the being has not been warmed for lately).
  waiting_cold:
    - "Waking up…"
    - "Getting everything ready…"

  # The opening phrase for `init: prime`, used when the page gives none
  # (window.egptChatPrimeText, then data-prime-text, then this). Empty: nothing is sent.
  prime_text: "Hi, I need help with my account."

# Per place (lowercase letters, digits, - and _), two optional settings:
#   css:        up to 20000 characters, added after skin.css
#   user_strip: show the signed user's short_name (else username) under the header
places:
  dashboard:
    user_strip: true
    css: ".egc{right:24px;bottom:24px}"
  mobile:
    css: ".egc-bubble{width:48px;height:48px;font-size:22px}"
